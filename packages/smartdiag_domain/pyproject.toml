[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdiag-domain"
version = "0.4.0"
description = "Pure business rules for SmartDiag504"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
