server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health { add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
  location = /healthz { add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
  # The gateway keeps the public /tallerv1 prefix; strip it only inside this container.
  location ^~ /tallerv1/ {
    rewrite ^/tallerv1/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
  location / { try_files $uri $uri/ /index.html; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
