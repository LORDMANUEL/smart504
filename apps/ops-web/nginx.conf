server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health { add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
  location = /healthz { add_header Content-Type application/json; return 200 '{"status":"ok"}'; }
  # The gateway keeps the public /tallerv1 prefix; strip it only inside this container.
  location ^~ /tallerv1/ {
    rewrite ^/tallerv1/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
  location / { try_files $uri $uri/ /index.html; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  # TLS terminates before this container; the browser still receives this header over HTTPS.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
}
