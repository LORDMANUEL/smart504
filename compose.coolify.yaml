name: smartdiag504

# Coolify production profile. It deliberately has no host ports, custom networks,
# Caddy, observability services, or image builds. Images must already exist in
# the private registry and be pinned by immutable digest in Coolify.

x-api-environment: &api-environment
  APP_VERSION: ${APP_IMAGE_TAG}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis-platform:6379/0
  MEDIA_BACKEND: ${MEDIA_BACKEND:-filesystem}
  MEDIA_ROOT: /var/lib/smartdiag/media
  PUBLIC_MEDIA_BASE_URL: /media
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_BUCKET: ${S3_BUCKET:-smartdiag-evidence}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
  EVENT_HMAC_SECRET: ${EVENT_HMAC_SECRET}
  CHAT_SESSION_SECRET: ${CHAT_SESSION_SECRET}
  AI_GATEWAY_INTERNAL_TOKEN: ${AI_GATEWAY_INTERNAL_TOKEN}
  PUBLIC_CHAT_ENABLED: ${PUBLIC_CHAT_ENABLED:-false}
  CORS_ORIGINS: ${CORS_ORIGINS}
  # Use the routed site URL so Frappe receives the correct tenant hostname.
  # An internal request without that Host header resolves to Frappe's default
  # site and returns 404 even when the requested ERP site is healthy.
  FRAPPE_BASE_URL: ${FRAPPE_BASE_URL:-https://erp.169.58.217.146.sslip.io}
  FRAPPE_API_KEY: ${FRAPPE_API_KEY}
  FRAPPE_API_SECRET: ${FRAPPE_API_SECRET}
  FRAPPE_PRICE_LIST: ${FRAPPE_PRICE_LIST:-Standard Selling}
  INVOICE_VERIFICATION_MODE: strict
  BUSINESS_NAME: ${BUSINESS_NAME:-SmartDiag504}
  BUSINESS_PHONE: ${BUSINESS_PHONE}
  BUSINESS_WHATSAPP_URL: ${BUSINESS_WHATSAPP_URL}
  BUSINESS_ADDRESS: ${BUSINESS_ADDRESS}
  BUSINESS_HOURS: ${BUSINESS_HOURS}

x-frappe-volumes: &frappe-volumes
  - frappe-sites:/home/frappe/frappe-bench/sites
  - frappe-logs:/home/frappe/frappe-bench/logs

x-frappe-image: &frappe-image
  image: ${FRAPPE_IMAGE}@${FRAPPE_IMAGE_DIGEST}
  pull_policy: always

services:
  haproxy:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        rm -f /tmp/haproxy.cfg;
        awk '1' /usr/local/etc/haproxy/haproxy.cfg > /tmp/haproxy.cfg;
        exec haproxy -f /tmp/haproxy.cfg
    expose: ["8080", "8081", "8082", "8084", "8085"]
    configs:
      - source: smartdiag-haproxy
        target: /usr/local/etc/haproxy/haproxy.cfg
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8404/stats"]
      interval: 10s
      timeout: 5s
      retries: 5

  public-web-a:
    image: ${PUBLIC_WEB_IMAGE}@${PUBLIC_WEB_IMAGE_DIGEST}
    restart: unless-stopped
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    healthcheck: &web-health
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 4s
      retries: 4
  public-web-b:
    image: ${PUBLIC_WEB_IMAGE}@${PUBLIC_WEB_IMAGE_DIGEST}
    restart: unless-stopped
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    healthcheck: *web-health
  ops-web-a:
    image: ${OPS_WEB_IMAGE}@${OPS_WEB_IMAGE_DIGEST}
    restart: unless-stopped
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    healthcheck: *web-health
  ops-web-b:
    image: ${OPS_WEB_IMAGE}@${OPS_WEB_IMAGE_DIGEST}
    restart: unless-stopped
    expose: ["8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    healthcheck: *web-health

  platform-migrate:
    image: ${PLATFORM_API_IMAGE}@${PLATFORM_API_IMAGE_DIGEST}
    restart: "no"
    exclude_from_hc: true
    environment: *api-environment
    command: ["alembic", "upgrade", "head"]
    volumes: ["platform-media:/var/lib/smartdiag/media"]
    depends_on:
      postgres: {condition: service_healthy}
      redis-platform: {condition: service_healthy}
  platform-api-a:
    image: ${PLATFORM_API_IMAGE}@${PLATFORM_API_IMAGE_DIGEST}
    restart: unless-stopped
    expose: ["8000"]
    environment:
      <<: *api-environment
      NODE_ID: smartdiag-api-a
      NODE_ROLE: platform-api
    volumes: ["platform-media:/var/lib/smartdiag/media"]
    depends_on:
      platform-migrate: {condition: service_completed_successfully}
      frappe-frontend: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck: &api-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  platform-api-b:
    image: ${PLATFORM_API_IMAGE}@${PLATFORM_API_IMAGE_DIGEST}
    restart: unless-stopped
    expose: ["8000"]
    environment:
      <<: *api-environment
      NODE_ID: smartdiag-api-b
      NODE_ROLE: platform-api
    volumes: ["platform-media:/var/lib/smartdiag/media"]
    depends_on:
      platform-migrate: {condition: service_completed_successfully}
      frappe-frontend: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck: *api-health

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis-platform:
    image: valkey/valkey:8.1.9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: ["redis-platform-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--innodb-file-per-table=1"]
    environment: {MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"}
    volumes: ["mariadb-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis-cache:
    image: valkey/valkey:8.1.9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: ["redis-cache-data:/data"]
    healthcheck: &valkey-health
      test: ["CMD-SHELL", "valkey-cli -a '${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis-queue:
    image: valkey/valkey:8.1.9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: ["redis-queue-data:/data"]
    healthcheck: *valkey-health

  frappe-configurator:
    <<: *frappe-image
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["bash", "-c"]
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    command:
      - >-
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host mariadb;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://:$${REDIS_PASSWORD}@redis-cache:6379";
        bench set-config -g redis_queue "redis://:$${REDIS_PASSWORD}@redis-queue:6379";
        bench set-config -g redis_socketio "redis://:$${REDIS_PASSWORD}@redis-queue:6379";
        bench set-config -gp socketio_port 9000
    volumes: *frappe-volumes
    depends_on:
      mariadb: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      redis-queue: {condition: service_healthy}
  frappe-site-init:
    <<: *frappe-image
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["bash", "-lc"]
    command:
      - >-
        if [[ -f "sites/$${ERP_SITE_NAME}/site_config.json" ]]; then
          bench --site "$${ERP_SITE_NAME}" execute frappe.model.document.unlock_document --kwargs '{"doctype":"Module Profile","name":"Field Service Management"}' || true;
        fi;
        exec /usr/local/bin/bootstrap-site.sh
    environment:
      ERP_SITE_NAME: ${ERP_SITE_NAME}
      ERP_ADMIN_PASSWORD: ${ERP_ADMIN_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      DB_HOST: mariadb
      DB_PORT: "3306"
      ERP_EXTERNAL_URL: ${ERP_EXTERNAL_URL}
      FRAPPE_API_KEY: ${FRAPPE_API_KEY}
      FRAPPE_API_SECRET: ${FRAPPE_API_SECRET}
    volumes: *frappe-volumes
    depends_on:
      frappe-configurator: {condition: service_completed_successfully}
  frappe-backend:
    <<: *frappe-image
    restart: unless-stopped
    expose: ["8000"]
    environment: {GUNICORN_THREADS: "4", GUNICORN_WORKERS: "2", GUNICORN_TIMEOUT: "120"}
    volumes: *frappe-volumes
    depends_on:
      frappe-site-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  frappe-websocket:
    <<: *frappe-image
    restart: unless-stopped
    expose: ["9000"]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    volumes: *frappe-volumes
    depends_on:
      frappe-site-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('net');const s=n.connect(9000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
  frappe-frontend:
    <<: *frappe-image
    restart: unless-stopped
    expose: ["8080"]
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: frappe-backend:8000
      SOCKETIO: frappe-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${ERP_SITE_NAME}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 10m
    volumes: *frappe-volumes
    depends_on:
      frappe-backend: {condition: service_healthy}
      frappe-websocket: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8080/api/method/ping',headers={'Host':'${ERP_SITE_NAME}'}); urllib.request.urlopen(r,timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 5
  frappe-queue-short:
    <<: *frappe-image
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short,default"]
    volumes: *frappe-volumes
    depends_on:
      frappe-site-init: {condition: service_completed_successfully}
  frappe-queue-long:
    <<: *frappe-image
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long,default,short"]
    volumes: *frappe-volumes
    depends_on:
      frappe-site-init: {condition: service_completed_successfully}
  frappe-scheduler:
    <<: *frappe-image
    restart: unless-stopped
    command: ["bench", "schedule"]
    volumes: *frappe-volumes
    depends_on:
      frappe-site-init: {condition: service_completed_successfully}

volumes:
  postgres-data:
  redis-platform-data:
  platform-media:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
  frappe-sites:
  frappe-logs:

configs:
  smartdiag-haproxy:
    content: |
      global
          log stdout format raw local0
          maxconn 4096

      resolvers docker
          nameserver dns 127.0.0.11:53
          resolve_retries 3
          timeout resolve 1s
          timeout retry 1s
          hold valid 10s

      defaults
          log global
          mode http
          option httplog
          option dontlognull
          timeout connect 5s
          timeout client 60s
          timeout server 60s
          timeout http-request 10s

      frontend smartdiag_gateway
          bind *:8084
          acl is_api path_beg /api/ /media/
          acl is_operations path_beg /tallerv1/
          use_backend platform_api_nodes if is_api
          use_backend ops_web_nodes if is_operations
          default_backend public_web_nodes

      frontend public_web
          bind *:8080
          default_backend public_web_nodes
      backend public_web_nodes
          balance roundrobin
          option httpchk GET /healthz
          http-check expect status 200
          server public-a public-web-a:8080 check resolvers docker init-addr libc,none inter 3s fall 2 rise 2
          server public-b public-web-b:8080 check resolvers docker init-addr libc,none inter 3s fall 2 rise 2

      frontend ops_web
          bind *:8081
          default_backend ops_web_nodes
      backend ops_web_nodes
          balance roundrobin
          option httpchk GET /healthz
          http-check expect status 200
          server ops-a ops-web-a:8080 check resolvers docker init-addr libc,none inter 3s fall 2 rise 2
          server ops-b ops-web-b:8080 check resolvers docker init-addr libc,none inter 3s fall 2 rise 2

      frontend platform_api
          bind *:8082
          default_backend platform_api_nodes
      backend platform_api_nodes
          balance roundrobin
          option httpchk GET /ready
          http-check expect status 200
          server api-a platform-api-a:8000 check resolvers docker init-addr libc,none inter 3s fall 2 rise 2
          server api-b platform-api-b:8000 check resolvers docker init-addr libc,none inter 3s fall 2 rise 2

      frontend frappe_erp
          bind *:8085
          default_backend frappe_erp_node
      backend frappe_erp_node
          option httpchk GET /api/method/ping
          http-check expect status 200
          server frappe frappe-frontend:8080 check resolvers docker init-addr libc,none inter 3s fall 2 rise 2

      listen stats
          bind 127.0.0.1:8404
          stats enable
          stats uri /stats
          stats refresh 5s

