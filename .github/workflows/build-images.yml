name: Build container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: public-web
            context: apps/public-web
            dockerfile: apps/public-web/Dockerfile
          - image: ops-web
            context: apps/ops-web
            dockerfile: apps/ops-web/Dockerfile
          - image: platform-api
            context: .
            dockerfile: services/platform-api/Dockerfile
          - image: ai-gateway
            context: .
            dockerfile: services/ai-gateway/Dockerfile
          - image: alerts-worker
            context: .
            dockerfile: services/alerts-worker/Dockerfile
          - image: heartbeat-agent
            context: .
            dockerfile: services/heartbeat-agent/Dockerfile
          - image: backup-runner
            context: .
            dockerfile: infra/backup/Dockerfile
          - image: frappe-workshop
            context: .
            dockerfile: infra/frappe/Containerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          secret-files: |
            apps_json=./infra/frappe/apps.json
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartdiag504-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/smartdiag504-${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
