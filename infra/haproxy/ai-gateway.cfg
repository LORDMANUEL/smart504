global
    log stdout format raw local0
    maxconn 1024
resolvers docker
    nameserver dns 127.0.0.11:53
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
frontend ai_gateway
    bind *:8090
    default_backend ai_gateway_nodes
backend ai_gateway_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server ai-a ai-gateway-a:8000 check resolvers docker init-addr libc,none inter 3s fall 2 rise 2
    server ai-b ai-gateway-b:8000 check resolvers docker init-addr libc,none inter 3s fall 2 rise 2
listen stats
    bind *:8405
    stats enable
    stats uri /stats
