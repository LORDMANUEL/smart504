global
    log stdout format raw local0
    maxconn 1024

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend smartdiag_gateway
    bind *:8084
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Permissions-Policy "camera=(self), microphone=(), geolocation=()"
    http-response set-header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: https://cloudflareinsights.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"
    acl blocked_source path_reg -i (\.php|\.phtml|\.phar|\.map|\.env|\.git)(/|$|\?)
    http-request deny deny_status 404 if blocked_source
    acl is_api path_beg /api/ /media/ /c/
    acl is_operations path_beg /tallerv1/
    use_backend platform_api if is_api
    use_backend operations if is_operations
    default_backend public_site

backend public_site
    option httpchk GET /healthz
    http-check expect status 200
    server public-web public-web:8080 check resolvers docker init-addr libc,none

backend operations
    option httpchk GET /healthz
    http-check expect status 200
    server ops-web ops-web:8080 check resolvers docker init-addr libc,none

backend platform_api
    option httpchk GET /ready
    http-check expect status 200
    server platform-api platform-api:8000 check resolvers docker init-addr libc,none
