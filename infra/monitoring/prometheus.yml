global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: smartdiag504
    environment: production

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: smartdiag-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://haproxy:8082/health
          - http://haproxy:8083/health
          - http://haproxy:8080/healthz
          - http://haproxy:8081/healthz
          - http://frappe-frontend:8080/api/method/ping
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
